services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: resolveflow
      POSTGRES_USER: resolveflow
      POSTGRES_PASSWORD: ${RESOLVE_POSTGRES_PASSWORD:?Set RESOLVE_POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resolveflow"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://resolveflow:${RESOLVE_POSTGRES_PASSWORD}@db:5432/resolveflow
      RESOLVE_LLM_BASE_URL: ${RESOLVE_LLM_BASE_URL:-}
      RESOLVE_LLM_CHAT_URL: ${RESOLVE_LLM_CHAT_URL:-}
      RESOLVE_LLM_MODEL: ${RESOLVE_LLM_MODEL:-}
      RESOLVE_LLM_API_KEY: ${RESOLVE_LLM_API_KEY:-}
      RESOLVE_LLM_TIMEOUT_SECONDS: ${RESOLVE_LLM_TIMEOUT_SECONDS:-20}
      RESOLVE_LLM_JSON_MODE: ${RESOLVE_LLM_JSON_MODE:-false}
      RESOLVE_CRM_EVIDENCE_URL: ${RESOLVE_CRM_EVIDENCE_URL:-}
      RESOLVE_OMS_EVIDENCE_URL: ${RESOLVE_OMS_EVIDENCE_URL:-}
      RESOLVE_PAYMENT_EVIDENCE_URL: ${RESOLVE_PAYMENT_EVIDENCE_URL:-}
      RESOLVE_LOGISTICS_EVIDENCE_URL: ${RESOLVE_LOGISTICS_EVIDENCE_URL:-}
      RESOLVE_KNOWLEDGE_EVIDENCE_URL: ${RESOLVE_KNOWLEDGE_EVIDENCE_URL:-}
      RESOLVE_OPERATOR_ID: ${RESOLVE_OPERATOR_ID:-}
      RESOLVE_OPERATOR_TOKEN: ${RESOLVE_OPERATOR_TOKEN:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
  worker:
    build: .
    command: ["python", "-m", "resolveflow.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://resolveflow:${RESOLVE_POSTGRES_PASSWORD}@db:5432/resolveflow
      RESOLVE_ACTION_API_URL: ${RESOLVE_ACTION_API_URL:-}
      RESOLVE_ACTION_STATUS_URL: ${RESOLVE_ACTION_STATUS_URL:-}
      RESOLVE_ACTION_API_TOKEN: ${RESOLVE_ACTION_API_TOKEN:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      api:
        condition: service_healthy
volumes:
  pgdata:
